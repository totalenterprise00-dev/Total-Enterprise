collections:
  - name: offers
    label: Offers
    path: content/offers
    fields:
      - name: category
        label: Category
        type: select
        options: [Offer, Drive Offer, Regular, Family Package]
      - name: operator
        label: Operator
        type: select
        options: [GP, Robi, Airtel, Banglalink, Teletalk]
      - name: type
        label: Type
        type: select
        options: [Internet, Minutes, Bundles, Call Rate]
      - name: packName
        label: Pack Name
        type: string
      - name: validity
        label: Validity
        type: string
      - name: price
        label: Price
        type: number
      - name: discount
        label: Discount
        type: number
